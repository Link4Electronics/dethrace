name: Workflow

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Tag to attach the AppImage release to. Leave empty to create the
          release against the current ref using a v<commit> tag.
        required: false
        default: ''

jobs:
  ci:
    strategy:
      matrix:
        platform:
          # Linux is built and packaged as an AppImage by the appimage job.
          - {
              name: "MacOS",
              arch: "arm64-x64",
              os: macos-latest,
              werror: true,
              cmake-args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"',
            }
          - {
              name: "Windows",
              arch: "x86",
              os: windows-latest,
              msvc-arch: "Win32",
            }
          - {
              name: "Windows",
              arch: "x64",
              os: windows-latest,
              msvc-arch: "x64",
            }
    #          - { name: 'Windows',  arch: 'arm64',        os: windows-latest, msvc-arch: 'amd64_arm64', cross: true }

    defaults:
      run:
        shell: sh
    runs-on: "${{ matrix.platform.os }}"
    name: "CI ${{ matrix.platform.name }} ${{ matrix.platform.arch }}"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Ninja
        uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: ${{ !!matrix.platform.msvc-arch }}
        with:
          arch: ${{ matrix.platform.msvc-arch }}
      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libgl1-mesa-dev libglu1-mesa-dev libxext-dev glslang-tools
      - name: Install macOS dependencies
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install glslang
      - name: Install glslang (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-windows-x86_64-release.zip -OutFile glslang.zip
          Expand-Archive glslang.zip -DestinationPath glslang
          echo "$((Resolve-Path glslang/bin).Path)" >> $env:GITHUB_PATH
      - name: Set up SDL
        uses: libsdl-org/setup-sdl@main
        with:
          add-to-environment: true
          build-type: Release
          install-linux-dependencies: true
          cmake-arguments: ${{ matrix.platform.cmake-args }}
          cmake-generator: Ninja
          cmake-toolchain-file: ${{ matrix.platform.cmake-toolchain-file }}
          discriminator: ${{ matrix.platform.arch }}
          version: 3-latest
          version-sdl2-compat: 2-head
          version-sdl12-compat: 1-head
      - name: Build SDL_shadercross (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_shadercross.git
          # The vendored build needs every external/ submodule checked out;
          # DirectXShaderCompiler is required by sdl_check_project_in_subfolder
          # even though DXC itself is only built for the D3D12 backend.
          git -C SDL_shadercross submodule update --init --depth 1 external/SPIRV-Cross external/SPIRV-Headers external/SPIRV-Tools external/DirectXShaderCompiler
          cmake -S SDL_shadercross -B SDL_shadercross/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDLSHADERCROSS_CLI=ON \
            -DSDLSHADERCROSS_SHARED=ON \
            -DSDLSHADERCROSS_STATIC=ON \
            -DSDLSHADERCROSS_TESTS=OFF \
            -DSDLSHADERCROSS_VENDORED=ON \
            -DSDLSHADERCROSS_DXC=OFF
          cmake --build SDL_shadercross/build --target shadercross
          echo "$PWD/SDL_shadercross/build" >>$GITHUB_PATH
      - name: Build SDL_shadercross (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_shadercross.git
          git -C SDL_shadercross submodule update --init --depth 1 external/SPIRV-Cross
          # Build + install SPIRV-Cross (shared) for find_package(spirv_cross_c_shared).
          cmake -S SDL_shadercross/external/SPIRV-Cross -B spirv-cross-build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_CROSS_SHARED=ON \
            -DSPIRV_CROSS_CLI=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/spirv-cross-prefix"
          cmake --build spirv-cross-build
          cmake --install spirv-cross-build
          # Download the prebuilt DXC binaries (dxcompiler.dll / dxil.dll).
          cmake -P SDL_shadercross/build-scripts/download-prebuilt-DirectXShaderCompiler.cmake
          # find_package hints must be exported to THIS shell: GITHUB_ENV only
          # applies to subsequent steps, but the shadercross configure runs here.
          export spirv_cross_c_shared_ROOT="$(cygpath -w "$PWD/spirv-cross-prefix");$(cygpath -w "$PWD/spirv-cross-prefix/share/spirv_cross_c_shared")"
          export DirectXShaderCompiler_ROOT="$(cygpath -w "$PWD/SDL_shadercross/external/DirectXShaderCompiler-binaries")"
          cmake -S SDL_shadercross -B SDL_shadercross/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDLSHADERCROSS_CLI=ON \
            -DSDLSHADERCROSS_SHARED=ON \
            -DSDLSHADERCROSS_STATIC=ON \
            -DSDLSHADERCROSS_TESTS=OFF \
            -DSDLSHADERCROSS_VENDORED=OFF \
            -DSDLSHADERCROSS_DXC=ON
          cmake --build SDL_shadercross/build --target shadercross
          echo "$(cygpath -w "$PWD/SDL_shadercross/build")" >>$GITHUB_PATH
          echo "$(cygpath -w "$PWD/spirv-cross-prefix/bin")" >>$GITHUB_PATH
          echo "$(cygpath -w "$PWD/SDL_shadercross/external/DirectXShaderCompiler-binaries/windows/bin/x64")" >>$GITHUB_PATH
      - name: "Prepare sources for release"
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "${{ github.ref_name }}" >VERSION
      - name: "Configure (CMake)"
        id: configure
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTS=ON \
            -DDETHRACE_WERROR=${{ !!matrix.platform.werror }} \
            -DCMAKE_POLICY_DEFAULT_CMP0074=NEW \
            -DDETHRACE_INSTALL=ON \
            -DDETHRACE_PACKAGE_PLATFORM=${{ matrix.platform.name }} \
            -DDETHRACE_PACKAGE_ARCH=${{ matrix.platform.arch }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.platform.cmake-toolchain-file }} \
            -DDETHRACE_PLATFORM_SDL1=ON \
            -DDETHRACE_PLATFORM_SDL2=ON \
            -DDETHRACE_PLATFORM_SDL3=ON \
            -DDETHRACE_PLATFORM_SDL_DYNAMIC=ON \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            ${{ matrix.platform.cmake-args }}
      - name: "Build (CMake)"
        run: |
          cmake --build build
      - name: "Test (CTest)"
        if: ${{ !matrix.platform.cross }}
        run: |
          ctest --test-dir build --verbose
      - name: "Package (CPack)"
        run: |
          cd build

          # DMG creation on macOS occasionally fails, so try multiple times
          # https://gitlab.kitware.com/cmake/cmake/-/issues/25671
          success=0
          max_tries=10
          for i in $(seq $max_tries); do
           cpack . && success=1
           if test $success = 1; then
            break
           fi
           echo "Package creation failed. Sleep 1 second and try again."
           sleep 1
          done
          if test $success = 0; then
           echo "Package creation failed after $max_tries attempts."
           exit 1
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ steps.configure.outputs.filename }}"
          path: "build/dist/${{ steps.configure.outputs.filename }}"
          if-no-files-found: error

  appimage:
    name: "AppImage ${{ matrix.arch }}"
    # Only build the AppImage on version tags and on manual dispatch, not on
    # every commit push / PR.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: []
    runs-on: "${{ matrix.runs-on }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 45
    defaults:
      run:
        shell: sh
    steps:
      # anylinux-setup-action installs git (and the other packaging tools) into
      # the container. It must run before checkout: actions/checkout needs git
      # in PATH for submodule support, otherwise it falls back to the REST API
      # download, which does not support `submodules`.
      - uses: pkgforge-dev/anylinux-setup-action@v2
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # The checkout was done by the host runner, so inside the container its
      # files are owned by a different uid, which git reports as dubious
      # ownership. make-appimage.sh runs `git rev-parse` for the version.
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The script pulls from Arch mirrors and downloads appimagetool from a
      # GitHub release; both have failed a leg outright when upstream returned
      # 5xx. Retry the whole script rather than any one fetch: pacman and the
      # CMake build are both incremental, so a second attempt costs seconds.
      - name: Make AppImage
        run: |
          for attempt in 1 2 3; do
            # Start each attempt from a clean AppDir: a run that died inside
            # quick-sharun leaves a half-populated tree behind, and the next
            # attempt would then fail on that rather than on the real cause.
            rm -rf ./AppDir ./dist
            if /bin/sh ./packaging/make-appimage.sh; then
              exit 0
            fi
            echo "AppImage build attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "AppImage build failed after 3 attempts" >&2
          exit 1
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: "AppImage-${{ matrix.arch }}"
          path: dist

  create-release:
    name: Create Release
    needs: [ci, appimage]
    # AppImage artifacts are only produced on version tags and manual
    # dispatches, so a release (and its tag) only ever forms there.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Calculate Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag_name }}" ]; then
              VERSION="${{ github.event.inputs.tag_name }}"
            else
              # VERSION.txt was written into each AppImage-* artifact by
              # make-appimage.sh; both copies are identical.
              VERSION="$(cat artifacts/AppImage-*/VERSION.txt | head -1)"
            fi
            echo "release_tag=${VERSION}" >>$GITHUB_OUTPUT
            echo "release_name=Dethrace ${VERSION#v}" >>$GITHUB_OUTPUT
          else
            echo "release_tag=${GITHUB_REF_NAME}" >>$GITHUB_OUTPUT
            echo "release_name=Dethrace ${GITHUB_REF_NAME#v}" >>$GITHUB_OUTPUT
          fi
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          name: ${{ steps.vars.outputs.release_name }}
          generate_release_notes: true
          tag_name: ${{ steps.vars.outputs.release_tag }}
          files: |
            artifacts/**

  reccmp:
    name: Verify decomp
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v4
        name: Checkout
        with:
          submodules: recursive
      - name: Fetch latest report
        run: |
          curl -Lo reccmp-report-report.json https://raw.githubusercontent.com/dethrace-labs/reccmp-report/refs/heads/main/report.json
      - uses: dethrace-labs/reccmp-action@main
        name: Build
        with:
          cmake_flags: -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMSVC_42_FOR_RECCMP=on
          build_only: true
      - uses: dethrace-labs/reccmp-action@main
        name: Run reccmp
        with:
          cmake_flags: -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMSVC_42_FOR_RECCMP=on
          target: CARM95
          diff_report_filename: ${{ github.workspace}}/reccmp-report-report.json
          report_filename: ${{ github.workspace}}/new-reccmp-report.json
          original_binary_url: https://archive.org/download/carm-95/CARM95.EXE
          original_binary_filename: CARM95.EXE
          reccmp_output_filename: ${{ github.workspace}}/reccmp-output.txt
          status_png_icon_filename: ${{ github.workspace}}/reccmp/carma_32x32_4.png
          status_svg_filename: ${{ github.workspace}}/new-reccmp-progress.svg
